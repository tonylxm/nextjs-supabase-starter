# Copy to .github/dependabot.yml. Set package-ecosystem to nuget or uv for .NET or Python.
version: 2
updates:
  - package-ecosystem: npm # also covers pnpm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
